name: Hosted Alpha CI

on:
  push:
    branches:
      - "m3/**"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "render.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/hosted-alpha-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=moderate

      - name: Unit, API, bridge, type, and build checks
        run: pnpm check

      - name: Install browser engines
        run: pnpm --filter @huddlecanvas/e2e exec playwright install --with-deps chromium firefox webkit

      - name: Cross-browser hosted workflow tests
        run: pnpm test:e2e
