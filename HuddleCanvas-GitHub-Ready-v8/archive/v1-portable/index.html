<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowBoard</title>
<style>
  :root{
    --bg:#f7f8fb;
    --panel:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
    --accent:#2563eb;
    --shadow:0 12px 30px rgba(17,24,39,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
  button,input{font:inherit}
  button{cursor:pointer}
  .app{position:relative;width:100%;height:100%}
  #boardWrap{
    position:absolute; inset:0;
    overflow:hidden;
    background:
      linear-gradient(#eef1f5 1px,transparent 1px),
      linear-gradient(90deg,#eef1f5 1px,transparent 1px);
    background-size:24px 24px;
    background-color:#fff;
    touch-action:none;
  }
  #world{
    position:absolute;
    left:0; top:0;
    transform-origin:0 0;
    width:4000px; height:3000px;
  }
  #board{
    position:absolute; left:0; top:0;
    width:4000px; height:3000px;
    touch-action:none;
  }
  #objects{position:absolute;inset:0;pointer-events:none}
  .sticky{
    position:absolute;
    width:210px;
    min-height:150px;
    padding:16px;
    border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.14);
    background:#fff2a8;
    pointer-events:auto;
    user-select:none;
  }
  .sticky.dragging{opacity:.9}
  .sticky textarea{
    width:100%; min-height:110px;
    resize:none; border:0; outline:0;
    background:transparent;
    font-size:16px; line-height:1.35;
    color:#3f3a25;
    user-select:text;
  }
  .sticky .noteTop{
    display:flex; justify-content:flex-end; gap:6px;
    margin:-7px -7px 5px 0;
  }
  .sticky .mini{
    width:24px;height:24px;border:0;border-radius:6px;background:rgba(255,255,255,.45);
  }
  .textObj{
    position:absolute;
    min-width:80px; min-height:30px;
    padding:4px 6px;
    font-size:22px;
    outline:1px dashed transparent;
    pointer-events:auto;
    user-select:text;
    white-space:pre-wrap;
  }
  .textObj:focus{outline-color:#60a5fa;background:rgba(255,255,255,.75)}
  .topbar{
    position:absolute;
    left:16px; top:14px;
    z-index:10;
    display:flex; align-items:center; gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:9px 10px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;padding:0 5px}
  .logo{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:white;font-size:16px}
  .divider{height:28px;width:1px;background:var(--border);margin:0 2px}
  .toolBtn,.actionBtn{
    height:38px; min-width:38px;
    border:0; border-radius:9px;
    background:#fff; color:#374151;
    display:inline-flex; align-items:center; justify-content:center;
    gap:7px;
    padding:0 10px;
  }
  .toolBtn:hover,.actionBtn:hover{background:#f3f4f6}
  .toolBtn.active{background:#e8f0ff;color:#1d4ed8}
  .toolBtn span{font-size:14px}
  .floating{
    position:absolute;
    left:50%; bottom:20px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;align-items:center;gap:8px;
    padding:9px;
    background:rgba(255,255,255,.96);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  .color{
    appearance:none;
    width:38px;height:38px;
    padding:4px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
  }
  .rangeWrap{display:flex;align-items:center;gap:8px;padding:0 6px}
  .rangeWrap label{font-size:12px;color:var(--muted)}
  #size{width:95px}
  .zoomPanel{
    position:absolute;
    right:16px; bottom:20px;
    z-index:10;
    display:flex;align-items:center;gap:4px;
    padding:6px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fff;
    box-shadow:var(--shadow);
  }
  .zoomPanel button{width:34px;height:34px;border:0;background:#fff;border-radius:8px}
  .zoomPanel button:hover{background:#f3f4f6}
  #zoomLabel{width:54px;text-align:center;font-size:13px;color:#4b5563}
  .hint{
    position:absolute;right:16px;top:16px;z-index:8;
    font-size:12px;color:#6b7280;
    background:rgba(255,255,255,.88);
    padding:7px 10px;border-radius:8px;border:1px solid #eee;
  }
  @media(max-width:850px){
    .topbar{left:8px;right:8px;overflow-x:auto;justify-content:flex-start}
    .brand span{display:none}
    .toolBtn span,.actionBtn span{display:none}
    .hint{display:none}
    .floating{bottom:12px;max-width:calc(100vw - 16px);overflow-x:auto}
    .zoomPanel{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div id="boardWrap">
    <div id="world">
      <canvas id="board" width="4000" height="3000"></canvas>
      <div id="objects"></div>
    </div>
  </div>

  <div class="topbar">
    <div class="brand"><div class="logo">✦</div><span>FlowBoard</span></div>
    <div class="divider"></div>
    <button class="toolBtn active" data-tool="pen" title="Pen">✎ <span>Pen</span></button>
    <button class="toolBtn" data-tool="highlighter" title="Highlighter">▰ <span>Highlight</span></button>
    <button class="toolBtn" data-tool="eraser" title="Eraser">⌫ <span>Eraser</span></button>
    <button class="toolBtn" data-tool="line" title="Line">╱ <span>Line</span></button>
    <button class="toolBtn" data-tool="rect" title="Rectangle">▭ <span>Rect</span></button>
    <button class="toolBtn" data-tool="ellipse" title="Ellipse">◯ <span>Ellipse</span></button>
    <button class="toolBtn" data-tool="text" title="Text">T <span>Text</span></button>
    <button class="toolBtn" data-tool="sticky" title="Sticky note">▣ <span>Sticky</span></button>
    <button class="toolBtn" data-tool="pan" title="Pan">✋ <span>Pan</span></button>
    <div class="divider"></div>
    <button id="undo" class="actionBtn" title="Undo">↶ <span>Undo</span></button>
    <button id="redo" class="actionBtn" title="Redo">↷ <span>Redo</span></button>
    <button id="clear" class="actionBtn" title="Clear board">⌧ <span>Clear</span></button>
    <button id="export" class="actionBtn" title="Export PNG">⇩ <span>Export</span></button>
  </div>

  <div class="floating">
    <input id="color" class="color" type="color" value="#111827" title="Color" />
    <div class="rangeWrap">
      <label for="size">Size</label>
      <input id="size" type="range" min="1" max="40" value="4" />
    </div>
  </div>

  <div class="zoomPanel">
    <button id="zoomOut">−</button>
    <div id="zoomLabel">100%</div>
    <button id="zoomIn">+</button>
    <button id="resetView" title="Reset view">⌂</button>
  </div>

  <div class="hint">Tip: mouse wheel to zoom • space + drag to pan</div>
</div>

<script>
(() => {
  const wrap = document.getElementById('boardWrap');
  const world = document.getElementById('world');
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const objects = document.getElementById('objects');
  const colorInput = document.getElementById('color');
  const sizeInput = document.getElementById('size');
  const zoomLabel = document.getElementById('zoomLabel');

  let tool = 'pen';
  let drawing = false;
  let start = null;
  let last = null;
  let tempSnapshot = null;
  let spaceDown = false;
  let panning = false;
  let panStart = null;
  let viewStart = null;
  let scale = 1, tx = 0, ty = 0;
  let undoStack = [], redoStack = [];
  const MAX_HISTORY = 30;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function setTool(next) {
    tool = next;
    document.querySelectorAll('.toolBtn').forEach(b => b.classList.toggle('active', b.dataset.tool === next));
    canvas.style.cursor =
      next === 'text' ? 'text' :
      next === 'sticky' ? 'copy' :
      next === 'pan' ? 'grab' :
      next === 'eraser' ? 'cell' : 'crosshair';
  }

  document.querySelectorAll('.toolBtn').forEach(btn => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });

  function applyView() {
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  function screenToWorld(clientX, clientY) {
    const r = wrap.getBoundingClientRect();
    return {
      x: (clientX - r.left - tx) / scale,
      y: (clientY - r.top - ty) / scale
    };
  }

  function snapshot() {
    return {
      image: canvas.toDataURL(),
      objects: objects.innerHTML
    };
  }

  function saveState() {
    undoStack.push(snapshot());
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }

  function restore(state) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0);
    };
    img.src = state.image;
    objects.innerHTML = state.objects;
    rebindObjects();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }

  document.getElementById('undo').onclick = undo;
  document.getElementById('redo').onclick = redo;

  document.getElementById('clear').onclick = () => {
    saveState();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    objects.innerHTML = '';
  };

  function startStroke(p) {
    drawing = true;
    start = last = p;
    tempSnapshot = ctx.getImageData(0,0,canvas.width,canvas.height);
    saveState();
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
  }

  function drawFree(p) {
    ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    if (tool === 'highlighter') {
      ctx.strokeStyle = hexToRgba(colorInput.value, .28);
      ctx.lineWidth = Math.max(12, Number(sizeInput.value) * 4);
    } else {
      ctx.strokeStyle = colorInput.value;
      ctx.lineWidth = tool === 'eraser' ? Math.max(12, Number(sizeInput.value) * 3) : Number(sizeInput.value);
    }
    ctx.beginPath();
    ctx.moveTo(last.x,last.y);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    last = p;
    ctx.globalCompositeOperation = 'source-over';
  }

  function redrawShape(p) {
    ctx.putImageData(tempSnapshot,0,0);
    ctx.strokeStyle = colorInput.value;
    ctx.lineWidth = Number(sizeInput.value);
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    const x = start.x, y = start.y, w = p.x-x, h = p.y-y;
    if (tool === 'line') {
      ctx.moveTo(x,y); ctx.lineTo(p.x,p.y);
    } else if (tool === 'rect') {
      ctx.rect(x,y,w,h);
    } else if (tool === 'ellipse') {
      ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);
    }
    ctx.stroke();
  }

  function addSticky(p) {
    saveState();
    const el = document.createElement('div');
    el.className = 'sticky';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.innerHTML = `
      <div class="noteTop">
        <button class="mini noteColor" title="Change color">◐</button>
        <button class="mini noteDelete" title="Delete">×</button>
      </div>
      <textarea placeholder="Type a note..."></textarea>
    `;
    objects.appendChild(el);
    bindSticky(el);
    el.querySelector('textarea').focus();
  }

  function bindSticky(el) {
    const palette = ['#fff2a8','#ffd9e8','#d8f3dc','#dbeafe','#ede9fe','#ffe4c7'];
    let idx = Math.max(0,palette.indexOf(rgbToHex(el.style.backgroundColor)));
    let drag = null;

    el.querySelector('.noteDelete').onclick = (e) => {
      e.stopPropagation();
      saveState();
      el.remove();
    };
    el.querySelector('.noteColor').onclick = (e) => {
      e.stopPropagation();
      saveState();
      idx = (idx + 1) % palette.length;
      el.style.background = palette[idx];
    };

    el.addEventListener('pointerdown', e => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
      e.stopPropagation();
      saveState();
      el.setPointerCapture(e.pointerId);
      drag = {x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top)};
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', e => {
      if (!drag) return;
      el.style.left = (drag.left + (e.clientX-drag.x)/scale) + 'px';
      el.style.top = (drag.top + (e.clientY-drag.y)/scale) + 'px';
    });
    el.addEventListener('pointerup', () => { drag = null; el.classList.remove('dragging'); });
  }

  function addText(p) {
    saveState();
    const el = document.createElement('div');
    el.className = 'textObj';
    el.contentEditable = 'true';
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.color = colorInput.value;
    el.innerHTML = 'Type here';
    objects.appendChild(el);
    bindText(el);
    requestAnimationFrame(() => {
      el.focus();
      document.execCommand?.('selectAll', false, null);
    });
  }

  function bindText(el) {
    let drag = null;
    el.addEventListener('pointerdown', e => {
      if (document.activeElement === el) return;
      saveState();
      drag = {x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top)};
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!drag) return;
      el.style.left = (drag.left + (e.clientX-drag.x)/scale)+'px';
      el.style.top = (drag.top + (e.clientY-drag.y)/scale)+'px';
    });
    el.addEventListener('pointerup', () => drag = null);
  }

  function rebindObjects(){
    objects.querySelectorAll('.sticky').forEach(bindSticky);
    objects.querySelectorAll('.textObj').forEach(bindText);
  }

  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const p = screenToWorld(e.clientX,e.clientY);
    const wantsPan = tool === 'pan' || spaceDown;
    if (wantsPan) {
      panning = true;
      panStart = {x:e.clientX,y:e.clientY};
      viewStart = {tx,ty};
      wrap.setPointerCapture(e.pointerId);
      canvas.style.cursor = 'grabbing';
      return;
    }
    if (e.target !== canvas) return;
    if (tool === 'sticky') return addSticky(p);
    if (tool === 'text') return addText(p);
    if (['pen','highlighter','eraser','line','rect','ellipse'].includes(tool)) startStroke(p);
  });

  wrap.addEventListener('pointermove', e => {
    if (panning) {
      tx = viewStart.tx + (e.clientX-panStart.x);
      ty = viewStart.ty + (e.clientY-panStart.y);
      applyView();
      return;
    }
    if (!drawing) return;
    const p = screenToWorld(e.clientX,e.clientY);
    if (['pen','highlighter','eraser'].includes(tool)) drawFree(p);
    else redrawShape(p);
  });

  wrap.addEventListener('pointerup', e => {
    drawing = false;
    tempSnapshot = null;
    if (panning) {
      panning = false;
      canvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
    }
  });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const old = scale;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    scale = Math.min(3,Math.max(.25,scale*factor));
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX-r.left, my=e.clientY-r.top;
    const wx = (mx-tx)/old, wy=(my-ty)/old;
    tx = mx-wx*scale; ty=my-wy*scale;
    applyView();
  }, {passive:false});

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
      spaceDown = true; e.preventDefault();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='z') {
      e.preventDefault();
      e.shiftKey ? redo() : undo();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='y') {
      e.preventDefault(); redo();
    }
    const keymap = {p:'pen',h:'highlighter',e:'eraser',l:'line',r:'rect',o:'ellipse',t:'text',s:'sticky',v:'pan'};
    if (!e.ctrlKey && !e.metaKey && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
      const k = e.key.toLowerCase();
      if (keymap[k]) setTool(keymap[k]);
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space') spaceDown = false;
  });

  document.getElementById('zoomIn').onclick = () => { scale=Math.min(3,scale*1.15); applyView(); };
  document.getElementById('zoomOut').onclick = () => { scale=Math.max(.25,scale/1.15); applyView(); };
  document.getElementById('resetView').onclick = () => { scale=1;tx=0;ty=0;applyView(); };

  document.getElementById('export').onclick = () => {
    const out = document.createElement('canvas');
    out.width = canvas.width; out.height = canvas.height;
    const octx = out.getContext('2d');
    octx.fillStyle = '#ffffff'; octx.fillRect(0,0,out.width,out.height);
    octx.drawImage(canvas,0,0);

    // Draw text and notes approximately into exported canvas.
    objects.querySelectorAll('.textObj').forEach(el => {
      octx.fillStyle = el.style.color || '#111827';
      octx.font = '22px sans-serif';
      const x=parseFloat(el.style.left), y=parseFloat(el.style.top)+24;
      (el.innerText || '').split('\n').forEach((line,i)=>octx.fillText(line,x,y+i*27));
    });

    objects.querySelectorAll('.sticky').forEach(el => {
      const x=parseFloat(el.style.left), y=parseFloat(el.style.top);
      const w=el.offsetWidth, h=el.offsetHeight;
      octx.fillStyle = getComputedStyle(el).backgroundColor;
      octx.fillRect(x,y,w,h);
      octx.fillStyle='#3f3a25'; octx.font='16px sans-serif';
      wrapText(octx, el.querySelector('textarea').value, x+16, y+38, w-32, 22);
    });

    const link = document.createElement('a');
    link.download = 'flowboard.png';
    link.href = out.toDataURL('image/png');
    link.click();
  };

  function wrapText(c,text,x,y,maxWidth,lineHeight){
    const paragraphs=(text||'').split('\n');
    paragraphs.forEach(par=>{
      const words=par.split(' '); let line='';
      words.forEach(word=>{
        const test=line+word+' ';
        if(c.measureText(test).width>maxWidth && line){
          c.fillText(line,x,y); line=word+' '; y+=lineHeight;
        } else line=test;
      });
      c.fillText(line,x,y); y+=lineHeight;
    });
  }

  function hexToRgba(hex,a){
    const n=parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }
  function rgbToHex(rgb){
    if(!rgb) return '';
    if(rgb.startsWith('#')) return rgb;
    const m=rgb.match(/\d+/g); if(!m) return '';
    return '#'+m.slice(0,3).map(v=>Number(v).toString(16).padStart(2,'0')).join('');
  }

  // Start with blank history state.
  applyView();
})();
</script>
</body>
</html>
